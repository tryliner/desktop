name: Personal Windows build (Spotify sync)

on:
  push:
    branches:
      - feature/spotify-playlist-auto-sync
    paths:
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "electron/**"
      - "native/**"
      - ".github/workflows/personal-windows-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format feature files
        run: pnpm exec prettier --write src/features/settings/ui/SettingsModal.tsx src/features/settings/ui/SpotifySyncTab.tsx

      - name: Lint, build and test
        run: pnpm lint && pnpm build && pnpm test

      - name: Build Windows installer without publishing a release
        run: pnpm electron:build:win -- --publish never

      - name: Upload private-use build artifact (not a public release)
        uses: actions/upload-artifact@v4
        with:
          name: Liner-Spotify-Sync-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 3
