name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, format, types, build, tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check build icons
        run: node scripts/verify-build-assets.mjs

      - name: Check
        run: pnpm check

  # the client ships before the api, so main may be ahead of the api's main: pull requests only
  contract:
    name: Contract matches the api
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: desktop

      # the api branch with the same name ships with this pull request, otherwise main
      - name: Pick the api branch
        id: api
        env:
          TOKEN: ${{ secrets.API_READ_TOKEN || github.token }}
          BRANCH: ${{ github.head_ref }}
        run: |
          if git ls-remote --exit-code --heads "https://x-access-token:${TOKEN}@github.com/tryliner/api.git" "$BRANCH" >/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout the api contract
        uses: actions/checkout@v4
        with:
          repository: tryliner/api
          ref: ${{ steps.api.outputs.ref }}
          token: ${{ secrets.API_READ_TOKEN || github.token }}
          path: api
          sparse-checkout: contract

      - name: Compare
        working-directory: desktop
        env:
          LINER_API_DIR: ../api
        run: node scripts/check-api-contract.mjs
