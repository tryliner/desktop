name: Bug report
description: Something in Liner doesn't work the way it should
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please check the [FAQ](https://github.com/tryliner/desktop/blob/main/docs/FAQ.md) first: the most common problems are covered there.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you report
      options:
        - label: I'm on the latest Liner version.
          required: true
        - label: I searched the open and closed issues and this isn't reported yet.
          required: true
        - label: "If tracks don't play or an import fails: https://music.youtube.com opens and plays in a normal browser on the same computer and network."

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Liner version
      description: Settings → About.
      placeholder: 0.2.11
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS (Apple silicon)
        - macOS (Intel)
        - Linux
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: Windows 11 24H2, macOS 15.3, Ubuntu 24.04

  - type: textarea
    id: logs
    attributes:
      label: Error text or logs
      description: The error message from the app, or the copied report from the crash screen. Screenshots help too.
      render: text
