[package]
name = "liner-signer"
version = "0.1.0"
description = "Secure HMAC request and cover signing module for Liner Desktop"
authors = ["Liner Team"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "liner_signer"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
zeroize = { version = "1", features = ["zeroize_derive"] }
getrandom = "0.2"
hex = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
